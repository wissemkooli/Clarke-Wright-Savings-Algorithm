<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarke-Wright VRP Solver</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Clarke-Wright Algorithm</h1>
            <p>Vehicle Routing Problem Solver with OpenStreetMap</p>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <div class="section">
                    <h2>Configuration</h2>
                    <div class="form-group">
                        <label>Vehicle Capacity:</label>
                        <input type="number" id="capacity" value="100" min="1">
                    </div>
                    <div class="form-group">
                        <label>Customer Demand (for new customers):</label>
                        <input type="number" id="defaultDemand" value="15" min="1">
                    </div>
                </div>

                <div class="section">
                    <h2>Map Controls</h2>
                    <p class="info-text">🔴 <strong>Red</strong> = Depot | 🔵 <strong>Blue</strong> = Customer</p>
                    <button id="setDepotBtn" class="btn btn-warning">Set Depot (click map)</button>
                    <button id="addCustomerBtn" class="btn btn-primary">Add Customers (click map)</button>
                    <button id="solveBtn" class="btn btn-success">Solve with Clarke-Wright</button>
                    <button id="clearBtn" class="btn btn-secondary">Clear All</button>
                    <p class="info-text" style="margin-top: 10px;">
                        <strong>Status:</strong> <span id="statusText">Click "Set Depot" to start</span>
                    </p>
                </div>

                <div class="section">
                    <h2>Nodes</h2>
                    <div id="nodesList" class="nodes-list"></div>
                </div>

                <div class="section results-section" id="resultsSection" style="display:none;">
                    <h2>Results</h2>
                    <div id="results"></div>
                </div>
            </div>

            <div class="right-panel">
                <div class="map-container">
                    <div id="map"></div>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" data-tab="savings">Top Savings</button>
                    <button class="tab-btn" data-tab="steps">Algorithm Steps</button>
                </div>

                <div class="tab-content">
                    <div id="savings-tab" class="tab-pane active">
                        <div id="savingsTable">
                            <p class="placeholder-text">Savings will appear here after solving</p>
                        </div>
                    </div>
                    <div id="steps-tab" class="tab-pane">
                        <div id="stepsContent">
                            <p class="placeholder-text">Algorithm steps will appear here after solving</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Routing Machine JS -->
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
